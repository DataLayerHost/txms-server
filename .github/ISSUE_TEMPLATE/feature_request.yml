name: Feature request
description: Propose an improvement to TxMS Server
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or use case should this feature address?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and public interface.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe existing workarounds or alternative designs.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - SMS or MMS processing
        - TxMS or hexadecimal decoding
        - Blockchain provider integration
        - Docker or deployment
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: compatibility
    attributes:
      label: Compatibility
      options:
        - label: This proposal preserves legacy hexadecimal and TxMS transmission, or explains why compatibility must change.
          required: true
