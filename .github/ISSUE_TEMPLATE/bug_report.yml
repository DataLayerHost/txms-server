name: Bug report
description: Report reproducible incorrect behavior in TxMS Server
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve TxMS Server. Please remove secrets and transaction-sensitive information from logs.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure...
        2. Send...
        3. Observe...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or image tag
      placeholder: v1.2.7
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider type
      options:
        - Blockbook
        - JSON-RPC
        - Other
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime environment
      description: Include the OS, architecture, Bun version, or container runtime as applicable.
      placeholder: Docker 27 on Ubuntu 24.04, linux/amd64
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact credentials, phone numbers, private endpoints, and sensitive transaction data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed secrets and sensitive information from this report.
          required: true
