name: Publish Docker image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --no-save

      - name: Type-check
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            tag_suffix: ""
            latest_tag: latest
            cache_scope: server
          - dockerfile: Dockerfile.core
            tag_suffix: -core
            latest_tag: core-latest
            cache_scope: server-core

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${REPOSITORY_OWNER,,}/txms-server" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}${{ matrix.tag_suffix }}
            type=raw,value=${{ matrix.latest_tag }},enable=${{ !github.event.release.prerelease }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          provenance: mode=max
          sbom: true

  deploy-testnet-backup:
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ github.event.release.tag_name }}-core
      environment_name: testnet-backup
      core_network: devin
    secrets: inherit

  deploy-testnet-primary:
    needs: deploy-testnet-backup
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ github.event.release.tag_name }}-core
      environment_name: testnet-primary
      core_network: devin
    secrets: inherit

  deploy-mainnet-backup:
    needs: deploy-testnet-primary
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ github.event.release.tag_name }}-core
      environment_name: mainnet-backup
      core_network: mainnet
    secrets: inherit

  deploy-mainnet-primary:
    needs: deploy-mainnet-backup
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ github.event.release.tag_name }}-core
      environment_name: mainnet-primary
      core_network: mainnet
    secrets: inherit
